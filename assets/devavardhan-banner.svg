<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="620" fill="url(#bg)"/>
  <text x="700" y="62" text-anchor="middle" fill="#9b5cff"
        font-family="monospace" font-size="32" font-weight="500">Hello, World</text>

  <rect x="70" y="115" width="1260" height="440" rx="28"
        fill="#000000" stroke="#273244" stroke-width="2"/>

  <!-- profile image from assets/image.png -->
  <clipPath id="profileClip">
    <circle cx="700" cy="225" r="55"/>
  </clipPath>
  <image
    href="https://raw.githubusercontent.com/deva18-ai/deva18-ai/main/assets/image.png"
    x="645" y="170" width="110" height="110"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#profileClip)"/>

  <text x="700" y="365" text-anchor="middle" fill="#ffffff"
        font-family="Georgia, serif" font-size="62" font-weight="700"
        letter-spacing="2">DEVAVARDHAN</text>

  <rect x="565" y="392" width="270" height="5" rx="3" fill="url(#accent)"/>

  <text x="700" y="455" text-anchor="middle" fill="#dbeafe"
        font-family="Arial, sans-serif" font-size="27">
    I build secure, intelligent, and scalable
  </text>
  <text x="700" y="492" text-anchor="middle" fill="#dbeafe"
        font-family="Arial, sans-serif" font-size="27">
    software solutions.
  </text>

  <text x="700" y="535" text-anchor="middle" fill="#8b7cff"
        font-family="monospace" font-size="20">
    Full-Stack Development • AI • Cybersecurity • Blockchain
  </text>
</svg>